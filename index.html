<script>
/* Supabase > Project Settings > API. The anon key is meant to be public; row-level security protects the data. */
const CFG = { URL: 'https://drshtcvadkznkpeecgdi.supabase.co', KEY: 'sb_publishable_fQiq5V28jk-oPuC9Mu6o1w_E1W0VmXh' };
const configured = !CFG.URL.includes('YOUR-PROJECT');
const sb = configured ? supabase.createClient(CFG.URL, CFG.KEY) : null;

const WR = ['Unrated','Rc','R','P2','P1','N4','N3','N2','N1','B','A'], PR = ['Unrated','B'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = { uid: null, me: null, users: [], events: [], av: [], asg: [] }, tab = 'availability', aEv = null, signup = false, aSort = 'name', dirQuery = '', recovering = false;

/* Helper to check if a referee only has Rc or Unrated ratings */
function isRcOrUnratedOnly(u) {
  const allowed = ['Unrated', 'Rc'];
  return allowed.includes(u.foil) && allowed.includes(u.epee) && allowed.includes(u.sabre) && allowed.includes(u.para);
}

/* Helper to check if a referee is completely unrated across all weapons */
function isCompletelyUnrated(u) {
  return u.foil === 'Unrated' && u.epee === 'Unrated' && u.sabre === 'Unrated' && u.para === 'Unrated';
}

/* ===== UI building blocks ===== */
const CLS = {
  input: 'block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-500 aria-[invalid=true]:border-red-600',
  ro: 'block w-full rounded-lg border border-slate-200 bg-slate-100 px-3 py-2.5 text-sm text-slate-700',
  label: 'block text-sm font-medium text-slate-800 mb-1',
  primary: 'inline-flex items-center justify-center gap-2 rounded-lg bg-ofa-navy px-4 py-2.5 text-sm font-semibold text-white hover:bg-ofa-ink disabled:opacity-50 disabled:cursor-not-allowed',
  secondary: 'inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-800 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed',
  danger: 'inline-flex items-center justify-center gap-2 rounded-lg bg-red-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-800',
  icon: 'inline-flex items-center justify-center gap-2 min-w-[2.5rem] h-10 px-2.5 rounded-lg text-slate-700 hover:bg-slate-100 hover:text-slate-900',
};
const REQ = '<span class="text-red-700" aria-hidden="true">*</span>';
const panel = inner => `<div class="bg-white rounded-2xl ring-1 ring-slate-200 shadow-sm p-4 sm:p-6">${inner}</div>`;
/* On phones the table panels drop their frame so each row can become its own card. */
const tablePanel = inner => `<div class="md:bg-white md:rounded-2xl md:ring-1 md:ring-slate-200 md:shadow-sm md:p-6">${inner}</div>`;
const viewHead = (title, desc, actions = '') => `<div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-4 sm:mb-6">
  <div><h2 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">${title}</h2>${desc ? `<p class="mt-1 text-sm text-slate-600 max-w-2xl">${desc}</p>` : ''}</div>${actions}</div>`;

/* Tables that turn into stacked cards below the md breakpoint. Cells carry data-label for their mobile caption. */
const TB = {
  table: 'w-full text-left text-sm max-md:block',
  thead: 'max-md:hidden',
  th: 'bg-slate-50 px-3 py-2.5 text-xs font-semibold uppercase tracking-wide text-slate-600 border-b border-slate-200',
  tbody: 'max-md:block max-md:space-y-3 md:divide-y md:divide-slate-100',
  tr: 'max-md:grid max-md:gap-x-4 max-md:gap-y-3 max-md:rounded-xl max-md:bg-white max-md:p-4 max-md:shadow-sm max-md:ring-1 max-md:ring-slate-200 md:hover:bg-slate-50',
  td: 'md:px-3 md:py-3 align-top min-w-0',
  lbl: 'max-md:before:block max-md:before:content-[attr(data-label)] max-md:before:mb-0.5 max-md:before:text-[11px] max-md:before:font-semibold max-md:before:uppercase max-md:before:tracking-wide max-md:before:text-slate-600',
};

const MSG = {
  error: ['border-red-200 bg-red-50 text-red-800', 'fa-circle-exclamation'],
  success: ['border-emerald-200 bg-emerald-50 text-emerald-900', 'fa-circle-check'],
  info: ['border-sky-200 bg-sky-50 text-sky-900', 'fa-circle-info'],
  warn: ['border-amber-200 bg-amber-50 text-amber-900', 'fa-triangle-exclamation'],
};
const msgBox = (kind, html, extra = '') => `<div class="flex gap-2.5 rounded-lg border p-3 text-sm ${MSG[kind][0]} ${extra}"><i class="fa-solid ${MSG[kind][1]} mt-0.5" aria-hidden="true"></i><div>${html}</div></div>`;

/* Inline message in a container (by id); with no container it falls back to a toast. Pass no text to clear. */
function say(where, kind, text) {
  const el = typeof where === 'string' ? $(where) : where;
  if (!el) return text && toast(text, kind);
  if (!text) { el.innerHTML = ''; el.classList.add('hidden'); return; }
  el.innerHTML = msgBox(kind, esc(text)); el.classList.remove('hidden');
}
function toast(text, kind = 'success') {
  const t = document.createElement('div');
  t.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  t.className = `pointer-events-auto flex items-start gap-3 rounded-xl border bg-white p-3 pl-4 text-sm text-slate-900 shadow-lg ${kind === 'error' ? 'border-red-300' : 'border-slate-200'}`;
  const color = { error: 'text-red-700', success: 'text-emerald-700', info: 'text-sky-700', warn: 'text-amber-700' }[kind];
  t.innerHTML = `<i class="fa-solid ${MSG[kind][1]} ${color} mt-0.5" aria-hidden="true"></i><p class="flex-1">${esc(text)}</p>
    <button type="button" aria-label="Dismiss" class="-m-1 grid place-items-center w-8 h-8 rounded-md text-slate-600 hover:bg-slate-100"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>`;
  t.querySelector('button').onclick = () => t.remove();
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'error' ? 8000 : 4000);
}
/* Flag a field as invalid, explain why in the given message area, and move focus to it. */
function fieldErr(id, where, text) {
  const f = $(id); say(where, 'error', text);
  if (f) { f.setAttribute('aria-invalid', 'true'); f.setAttribute('aria-describedby', where); f.focus(); }
}
document.addEventListener('input', e => e.target.removeAttribute?.('aria-invalid'));
document.addEventListener('change', e => e.target.removeAttribute?.('aria-invalid'));

/* Disable a button while its request is in flight. */
async function busy(btn, fn) {
  if (!btn) return fn();
  btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  try { return await fn(); } finally { btn.disabled = false; btn.removeAttribute('aria-busy'); }
}
/* Re-render something and put keyboard focus back on the equivalent control (matched by data-key). */
function withFocus(fn) {
  const a = document.activeElement, key = a?.dataset?.key;
  fn();
  const moved = document.activeElement && document.activeElement !== document.body; // fn() may have placed focus itself
  if (key && !document.contains(a) && !moved) document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.focus();
}

function setCloud(ok, t) {
  $('cloud').className = `text-xs font-medium flex items-center rounded-full bg-white/10 px-2.5 py-1 ${ok ? 'text-emerald-200' : 'text-amber-200'}`;
  $('cloud').innerHTML = `<span class="inline-block w-2 h-2 rounded-full ${ok ? 'bg-emerald-400' : 'bg-amber-400'} sm:mr-1.5" aria-hidden="true"></span><span class="sr-only sm:not-sr-only">${esc(t)}</span>`;
  $('cloud').title = t;
}
const fail = (r, where) => { if (r?.error) { say(where, 'error', r.error.message); return true; } return false; };

/* ===== Auth ===== */
function toggleMode() {
  signup = !signup;
  $('signupFields').classList.toggle('hidden', !signup);
  $('authTitle').textContent = signup ? 'Create account' : 'Portal sign in';
  $('authBtn').textContent = signup ? 'Create account' : 'Sign in';
  $('modeLink').textContent = signup ? 'I already have an account' : 'Create an account';
  $('aPass').autocomplete = signup ? 'new-password' : 'current-password';
  $('passHint').classList.toggle('hidden', !signup);
  say('authMsg');
}
async function doAuth(e) {
  e.preventDefault(); if (!sb) return;
  say('authMsg');
  const email = $('aEmail').value.trim(), password = $('aPass').value;
  if (signup) {
    const name = $('aName').value.trim();
    const gender = $('aGender').value;
    const phone = $('aPhone').value.trim();
    const region = $('aRegion').value.trim();

    if (!name) return fieldErr('aName', 'authMsg', 'Please enter your full name.');
    if (!gender) return fieldErr('aGender', 'authMsg', 'Please select your gender.');
    if (!phone) return fieldErr('aPhone', 'authMsg', 'Please enter your phone number.');
    if (!region) return fieldErr('aRegion', 'authMsg', 'Please enter your home region.');
    if (password.length < 10) return fieldErr('aPass', 'authMsg', 'Use a password with at least 10 characters.');

    const r = await busy($('authBtn'), () => sb.auth.signUp({
      email,
      password,
      options: {
        data: {
          name,
          gender,
          phone,
          region
        }
      }
    }));
    if (fail(r, 'authMsg')) return;
    if (!r.data.session) { toggleMode(); say('authMsg', 'success', 'Check your email to confirm your account, then sign in.'); }
  } else {
    if (fail(await busy($('authBtn'), () => sb.auth.signInWithPassword({ email, password })), 'authMsg')) return;
  }
}
async function forgot() {
  const email = $('aEmail').value.trim();
  if (!sb || !email) return fieldErr('aEmail', 'authMsg', 'Enter your email address first.');
  if (!fail(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] }), 'authMsg')) say('authMsg', 'success', 'If that email has an account, a reset link is on its way.');
}
async function logout() { await sb.auth.signOut(); }
function showDash(on) {
  $('login').classList.toggle('hidden', on); $('dash').classList.toggle('hidden', !on);
  $('badge').classList.toggle('hidden', !on); $('badge').classList.toggle('flex', on);
  if (!on) { closeModal(); $('aPass').value = ''; S = { uid: null, me: null, users: [], events: [], av: [], asg: [] }; }
}
async function enter(session) {
  if (!session) return showDash(false);
  S.uid = session.user.id; await load();
  if (!S.me || !S.me.active) {
    const why = S.me ? 'Your account is inactive. Contact an OFA admin.' : 'We could not load your account. Check your connection and try again.';
    await sb.auth.signOut(); say('authMsg', 'error', why); return;
  }
  showDash(true); render();
}
if (sb) {
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { tab = 'profile'; recovering = true; }
    if (ev === 'SIGNED_OUT') showDash(false); else if (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION' || ev === 'PASSWORD_RECOVERY') setTimeout(() => enter(session), 0);
  });
} else { $('setupWarn').classList.remove('hidden'); setCloud(false, 'Not configured'); }

/* ===== Data ===== */
async function load() {
  const [p, e, a, g] = await Promise.all([
    sb.from('profiles').select('*').order('name'), sb.from('events').select('*').order('created_at'),
    sb.from('availability').select('*'), sb.from('assignments').select('*')]);
  const bad = [p, e, a, g].find(r => r.error);
  if (bad) { setCloud(false, 'Load failed'); console.error(bad.error); return; }
  S.users = p.data; S.events = e.data; S.av = a.data; S.asg = g.data;
  S.me = S.users.find(u => u.id === S.uid); setCloud(true, 'Connected');
}
async function refresh() { await load(); render(); }
function go(t) { tab = t; refresh(); }
const avOf = (uid, evId, day) => S.av.find(r => r.user_id === uid && r.event_id === evId && r.day === day)?.status;

/* Mirror a saved availability/accommodation row in local state (status null = row deleted). */
function setAvLocal(uid, evId, day, status) {
  S.av = S.av.filter(r => !(r.user_id === uid && r.event_id === evId && r.day === day));
  if (status) S.av.push({ user_id: uid, event_id: evId, day, status });
}

/* Helper to compute the clean night before start date (-1 day) */
function getAccomDays(ev) {
  if (!ev || !ev.date_range) return ['Night before', ...(ev?.days || [])];

  const rawStart = ev.date_range.split('-')[0].trim();
  let nightBeforeLabel = 'Night before (' + rawStart + ')';

  try {
    // Year: from the start date, else from anywhere in the range ("Mar 1-2, 2028"),
    // else the first occurrence on or after the day the event was created.
    const YEAR = /\b(?:19|20)\d{2}\b/;
    const rangeYear = (ev.date_range.match(YEAR) || [])[0];
    let parsedDate;
    if (YEAR.test(rawStart)) parsedDate = new Date(rawStart);
    else if (rangeYear) parsedDate = new Date(rawStart + ' ' + rangeYear);
    else {
      const base = ev.created_at ? new Date(ev.created_at) : new Date();
      parsedDate = new Date(rawStart + ' ' + base.getFullYear());
      base.setHours(0, 0, 0, 0);
      if (!isNaN(parsedDate) && parsedDate < base) parsedDate.setFullYear(parsedDate.getFullYear() + 1);
    }
    if (!isNaN(parsedDate)) {
      parsedDate.setDate(parsedDate.getDate() - 1);
      const options = { month: 'short', day: 'numeric' };
      nightBeforeLabel = 'Night before (' + parsedDate.toLocaleDateString('en-US', options) + ')';
    }
  } catch (e) {}

  return [nightBeforeLabel, ...(ev.days || [])];
}

const accomOf = (uid, evId, day) => {
  return S.av.find(r => r.user_id === uid && r.event_id === evId && r.day === 'ACCOM:' + day)?.status === 'yes';
};

function status(ev, uid) {
  const v = ev.days.map(d => avOf(uid, ev.id, d)), y = v.filter(x => x === 'yes').length, n = v.filter(x => x === 'no').length, a = v.filter(Boolean).length;
  return !v.length ? 'unanswered' : y === v.length ? 'available' : n === v.length ? 'unavailable' : a ? 'partial' : 'unanswered';
}
const BADGE = { available: ['bg-emerald-100 text-emerald-900', 'Available'], unavailable: ['bg-red-100 text-red-900', 'Unavailable'], partial: ['bg-amber-100 text-amber-900', 'Partial'], unanswered: ['bg-slate-200 text-slate-800', 'Not answered'] };
const pill = s => `<span class="inline-flex items-center whitespace-nowrap text-[11px] font-bold uppercase tracking-wide px-2.5 py-1 rounded-full ${BADGE[s][0]}">${BADGE[s][1]}</span>`;

/* ===== Shell ===== */
const TABS = [
  ['availability', 'fa-calendar-days', 'My availability', ['referee', 'assignor', 'admin'], 'Availability'],
  ['profile', 'fa-user-gear', 'Profile & ratings', ['referee', 'assignor', 'admin'], 'Profile'],
  ['directory', 'fa-address-book', 'Referee directory', ['referee', 'assignor', 'admin'], 'Directory'],
  ['assignor', 'fa-clipboard-list', 'Assignor desk', ['assignor', 'admin'], 'Assignor'],
  ['admin', 'fa-shield-halved', 'Admin', ['admin'], 'Admin']
];

function render() { withFocus(renderNow); }
function renderNow() {
  const u = S.me; if (!u) return;
  if (!TABS.find(t => t[0] === tab)[3].includes(u.role)) tab = 'availability';
  $('hName').textContent = u.name; $('hRole').textContent = u.role;
  $('greet').innerHTML = `Signed in as <span class="font-semibold text-slate-900">${esc(u.name)}</span> (${esc(u.role)})`;
  $('tabs').innerHTML = TABS.filter(t => t[3].includes(u.role)).map(t => {
    const on = tab === t[0];
    return `<button type="button" data-tab="${t[0]}" data-key="tab:${t[0]}" onclick="go(this.dataset.tab)" ${on ? 'aria-current="page"' : ''}
      class="inline-flex items-center gap-2 -mb-px border-b-[3px] px-3 sm:px-4 py-3 text-sm font-semibold whitespace-nowrap transition ${on ? 'border-ofa-red text-ofa-navy' : 'border-transparent text-slate-600 hover:text-slate-900 hover:border-slate-400'}">
      <i class="fa-solid ${t[1]}" aria-hidden="true"></i><span class="sm:hidden">${t[4]}</span><span class="hidden sm:inline">${t[2]}</span></button>`;
  }).join('');
  ['availability', 'profile', 'directory', 'assignor', 'admin'].forEach(t => $('v-' + t).classList.toggle('hidden', t !== tab));
  ({ availability: rAvail, profile: rProfile, directory: rDirectory, assignor: rAssignor, admin: rAdmin })[tab]();
}

/* ===== Availability (per day) ===== */
/* [selected colours, visible label, tooltip, extra words for screen readers] */
const DAYBTN = { yes: ['bg-emerald-700 border-emerald-700', '<i class="fa-solid fa-check" aria-hidden="true"></i> Full', 'Full day', ' day'], am: ['bg-sky-700 border-sky-700', 'AM', 'Morning only', ' (morning only)'], pm: ['bg-sky-700 border-sky-700', 'PM', 'Afternoon only', ' (afternoon only)'], no: ['bg-red-700 border-red-700', '<i class="fa-solid fa-xmark" aria-hidden="true"></i> No', 'Unavailable', ' (unavailable)'] };
const dayBtns = (evId, i, v, disabled) => Object.entries(DAYBTN).map(([k, [on, label, tip, sr]]) => `<button type="button" ${disabled ? 'disabled' : ''} data-ev="${esc(evId)}" data-i="${i}" data-k="${k}" data-key="day:${esc(evId)}:${i}:${k}" onclick="setDay(this.dataset.ev, +this.dataset.i, this.dataset.k)" aria-pressed="${v === k}" title="${tip}" class="inline-flex items-center justify-center gap-1 min-h-[44px] sm:min-h-[36px] sm:min-w-[3.25rem] px-2.5 rounded-lg border text-xs font-semibold ${v === k ? on + ' text-white' : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100'} disabled:opacity-50 disabled:cursor-not-allowed">${label}<span class="sr-only">${sr}</span></button>`).join('');

function rAvail() {
  const u = S.me;
  const completelyUnrated = isCompletelyUnrated(u);
  const isInactive = !u.active;

  /* Reachable: enter() only checks `active` at sign-in, but every later refresh() re-reads the profile,
     so an account deactivated mid-session lands here on the next click. */
  let globalBlockBanner = '';
  if (isInactive) {
    globalBlockBanner = msgBox('error', 'Your account status is currently <strong>Inactive</strong>. You cannot submit availability until an admin activates your account.', 'mb-4');
  } else if (completelyUnrated) {
    globalBlockBanner = msgBox('warn', 'You are currently listed as <strong>Unrated</strong> across all weapons. Referees who are completely unrated cannot submit availability until an admin assigns a rating.', 'mb-4');
  }

  $('v-availability').innerHTML = `${viewHead('Tournament availability', 'Mark each day as full day, morning only (AM), afternoon only (PM), or unavailable. Select your choice again to clear it.')}
   ${globalBlockBanner}
   <div class="space-y-4 sm:space-y-5">${S.events.length ? S.events.map(evCard).join('') : panel('<p class="text-sm text-slate-600">No tournaments yet. An admin can add one in the Admin tab.</p>')}</div>`;
}

function evCard(ev) {
  const u = S.me, n = S.events.indexOf(ev);
  const assigned = S.asg.some(a => a.event_id === ev.id && a.user_id === u.id);
  const eventBlocked = isCompletelyUnrated(u) || !u.active || assigned;
  const accomDays = getAccomDays(ev);
  const isAccomNeeded = accomDays.some(d => accomOf(u.id, ev.id, d));

  return `<article data-ev-card="${esc(ev.id)}" aria-labelledby="evt-${n}" class="event-card bg-white rounded-2xl ring-1 ring-slate-200 shadow-sm p-4 sm:p-6 ${assigned ? 'assigned-locked' : ''}" data-assigned="${assigned ? 'true' : 'false'}">
    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
     <div class="min-w-0">
      <div class="flex flex-wrap items-center gap-1.5">${pill(status(ev, u.id))}
       ${assigned ? '<span class="inline-flex items-center gap-1 text-[11px] font-bold uppercase tracking-wide px-2.5 py-1 rounded-full bg-blue-100 text-blue-900"><i class="fa-solid fa-lock" aria-hidden="true"></i> Assigned</span>' : ''}</div>
      <h3 id="evt-${n}" class="mt-2 text-lg font-bold text-slate-900">${esc(ev.name)}</h3>
      <p class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-600"><span><i class="fa-solid fa-calendar mr-1.5" aria-hidden="true"></i>${esc(ev.date_range)}</span><span><i class="fa-solid fa-location-dot mr-1.5" aria-hidden="true"></i>${esc(ev.location)}</span></p>
     </div>
     <div class="grid grid-cols-2 gap-2 md:flex md:shrink-0">
      <button type="button" ${eventBlocked ? 'disabled' : ''} data-ev="${esc(ev.id)}" data-key="all:${esc(ev.id)}:yes" onclick="setAll(this.dataset.ev, 'yes')" class="${CLS.secondary} !px-3 !py-2 text-xs"><i class="fa-solid fa-check-double text-emerald-700" aria-hidden="true"></i>All days available</button>
      <button type="button" ${eventBlocked ? 'disabled' : ''} data-ev="${esc(ev.id)}" data-key="all:${esc(ev.id)}:no" onclick="setAll(this.dataset.ev, 'no')" class="${CLS.secondary} !px-3 !py-2 text-xs"><i class="fa-solid fa-ban text-red-700" aria-hidden="true"></i>All days unavailable</button>
     </div>
    </div>

    ${assigned ? msgBox('info', 'You have been assigned to this tournament. Availability and accommodation are now locked.', 'mt-4') : ''}

    <fieldset class="mt-5">
     <legend class="mb-2 text-sm font-semibold text-slate-800">Daily availability</legend>
     <div class="grid gap-2 lg:grid-cols-2">${ev.days.map((day, i) => { const v = avOf(u.id, ev.id, day); return `<div class="rounded-xl border border-slate-200 bg-slate-50 p-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
       <span id="dl-${n}-${i}" class="text-sm font-medium text-slate-800">${esc(day)}</span>
       <div role="group" aria-labelledby="dl-${n}-${i}" class="grid grid-cols-4 gap-1.5 sm:flex">${dayBtns(ev.id, i, v, eventBlocked)}</div></div>`; }).join('')}</div>
    </fieldset>

    <div class="mt-4 rounded-xl border border-slate-200 p-3 sm:p-4">
     <div class="flex items-center gap-3">
      <input type="checkbox" id="acc-${n}" aria-controls="accom-box-${n}" ${eventBlocked ? 'disabled' : ''} ${isAccomNeeded ? 'checked' : ''} data-ev="${esc(ev.id)}" data-key="accneed:${esc(ev.id)}" onchange="toggleAccomNeeded(this.dataset.ev, this.checked)" class="h-5 w-5 shrink-0 accent-ofa-navy disabled:cursor-not-allowed">
      <label for="acc-${n}" class="text-sm font-semibold text-slate-800 ${eventBlocked ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}"><i class="fa-solid fa-bed text-ofa-navy mr-1" aria-hidden="true"></i> Accommodation required for this tournament</label>
     </div>
     <div id="accom-box-${n}" class="${isAccomNeeded ? '' : 'hidden'} mt-3 pt-3 border-t border-slate-100">
      <fieldset>
       <legend class="mb-2 text-sm text-slate-700">Select the nights you need accommodation:</legend>
       <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">${accomDays.map((accDay, idx) => `<div class="flex items-center gap-2.5 rounded-lg border border-slate-200 bg-slate-50 px-3">
         <input type="checkbox" id="acc-${n}-${idx}" ${eventBlocked ? 'disabled' : ''} ${accomOf(u.id, ev.id, accDay) ? 'checked' : ''} data-ev="${esc(ev.id)}" data-day="${esc(accDay)}" data-key="acc:${esc(ev.id)}:${idx}" onchange="setAccomDay(this.dataset.ev, this.dataset.day, this.checked)" class="h-4 w-4 shrink-0 accent-ofa-navy disabled:cursor-not-allowed">
         <label for="acc-${n}-${idx}" class="flex-1 py-2.5 text-sm text-slate-800 ${eventBlocked ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}">${esc(accDay)}</label></div>`).join('')}</div>
      </fieldset>
     </div>
    </div>
   </article>`;
}
/* Re-draw one tournament card from local state instead of reloading everything. */
function rerenderEvent(evId) {
  const ev = S.events.find(e => e.id === evId), el = document.querySelector(`[data-ev-card="${CSS.escape(evId)}"]`);
  if (!ev || !el) return;
  withFocus(() => { el.outerHTML = evCard(ev); });
}
function blockedReason(evId) {
  if (!S.me.active) return 'Your account is inactive, so availability is locked.';
  if (isCompletelyUnrated(S.me)) return 'You need a rating from an admin before you can submit availability.';
  if (S.asg.some(a => a.event_id === evId && a.user_id === S.uid)) return 'You cannot modify availability for a tournament you are assigned to.';
  return '';
}

async function setDay(evId, i, val) {
  const why = blockedReason(evId); if (why) return toast(why, 'error');
  const day = S.events.find(e => e.id === evId).days[i], uid = S.uid;
  const clear = avOf(uid, evId, day) === val;
  const r = clear
    ? await sb.from('availability').delete().match({ user_id: uid, event_id: evId, day })
    : await sb.from('availability').upsert({ user_id: uid, event_id: evId, day, status: val }, { onConflict: 'user_id,event_id,day' });
  if (fail(r)) return;
  setAvLocal(uid, evId, day, clear ? null : val);
  rerenderEvent(evId);
}
async function setAll(evId, val) {
  const why = blockedReason(evId); if (why) return toast(why, 'error');
  const ev = S.events.find(e => e.id === evId);
  const r = await sb.from('availability').upsert(ev.days.map(day => ({ user_id: S.uid, event_id: evId, day, status: val })), { onConflict: 'user_id,event_id,day' });
  if (fail(r)) return;
  ev.days.forEach(day => setAvLocal(S.uid, evId, day, val));
  rerenderEvent(evId);
}

async function toggleAccomNeeded(evId, needed) {
  if (blockedReason(evId)) return rerenderEvent(evId);
  const ev = S.events.find(e => e.id === evId);
  const accomDays = getAccomDays(ev);
  const uid = S.uid;
  const r = needed
    ? await sb.from('availability').upsert(accomDays.map(accDay => ({ user_id: uid, event_id: evId, day: 'ACCOM:' + accDay, status: 'yes' })), { onConflict: 'user_id,event_id,day' })
    : await sb.from('availability').delete().match({ user_id: uid, event_id: evId }).like('day', 'ACCOM:%');
  if (!fail(r)) {
    if (needed) accomDays.forEach(d => setAvLocal(uid, evId, 'ACCOM:' + d, 'yes'));
    else S.av = S.av.filter(x => !(x.user_id === uid && x.event_id === evId && String(x.day).startsWith('ACCOM:')));
  }
  rerenderEvent(evId); // re-draw either way so the checkbox matches what is actually saved
}

async function setAccomDay(evId, accDay, checked) {
  if (blockedReason(evId)) return rerenderEvent(evId);
  const uid = S.uid;
  const dayKey = 'ACCOM:' + accDay;
  const r = checked
    ? await sb.from('availability').upsert({ user_id: uid, event_id: evId, day: dayKey, status: 'yes' }, { onConflict: 'user_id,event_id,day' })
    : await sb.from('availability').delete().match({ user_id: uid, event_id: evId, day: dayKey });
  if (!fail(r)) setAvLocal(uid, evId, dayKey, checked ? 'yes' : null);
  rerenderEvent(evId);
}

/* ===== Profile ===== */
const sameName = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();

function rProfile() {
  const u = S.me;
  const inp = (id, label, v, ro, req = true, attrs = '') => `<div><label for="${id}" class="${CLS.label}">${label} ${req ? REQ : ''}</label><input id="${id}" value="${esc(v)}" ${ro ? 'readonly' : ''} ${attrs} class="${ro ? CLS.ro : CLS.input}"></div>`;
  const rate = (l, v) => `<div class="rounded-xl bg-slate-50 ring-1 ring-slate-200 p-3 text-center"><div class="text-[11px] font-bold uppercase tracking-wide text-slate-600">${l}</div><div class="mt-0.5 text-base font-bold text-slate-900">${esc(v)}</div></div>`;
  const section = (title, icon, body, hint = '') => `<div class="border-t border-slate-200 pt-5"><h3 class="text-sm font-bold text-slate-900"><i class="fa-solid ${icon} text-ofa-navy mr-1.5" aria-hidden="true"></i>${title}</h3>${hint ? `<p class="mt-1 text-sm text-slate-600">${hint}</p>` : ''}<div class="mt-3">${body}</div></div>`;

  const prefs = Array.isArray(u.roommate_prefs) ? u.roommate_prefs : [];
  const names = [...new Set(S.users.filter(x => x.id !== u.id && x.active && x.name).map(x => x.name))].sort((a, b) => a.localeCompare(b));
  const roommateSelect = num => {
    const saved = prefs[num - 1] || '';
    const match = names.find(n => sameName(n, saved));
    const legacy = saved && !match ? `<option value="${esc(saved)}" selected>${esc(saved)} (not found in directory)</option>` : '';
    return `<div class="flex items-center gap-3">
      <label for="pRoommate${num}" class="w-24 shrink-0 text-sm font-medium text-slate-700">Choice ${num}${num === 1 ? '<span class="sr-only"> (most preferred)</span>' : ''}</label>
      <select id="pRoommate${num}" onchange="syncRoommates()" class="${CLS.input}">
       <option value="">No preference</option>${legacy}
       ${names.map(n => `<option value="${esc(n)}" ${n === match ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      </select></div>`;
  };

  $('v-profile').innerHTML = `<div class="max-w-3xl">${viewHead('Profile & certification ratings', 'Update your personal details, gender, meal restrictions, and roommate preferences. Ratings are set by OFA admins.')}
  ${panel(`<form onsubmit="saveProfile(event)" class="space-y-5" novalidate>
   <div class="grid sm:grid-cols-2 gap-4">
    ${inp('pName', 'Full name', u.name, false, true, 'autocomplete="name"')}
    ${inp('pEmail', 'Email address', u.email, true)}
    ${inp('pPhone', 'Phone number', u.phone, false, true, 'type="tel" autocomplete="tel"')}
    ${inp('pRegion', 'Home region', u.region)}
    <div>
     <label for="pGender" class="${CLS.label}">Gender ${REQ}</label>
     <select id="pGender" class="${CLS.input}">
      <option value="">Select gender…</option>
      <option value="Male" ${u.gender === 'Male' ? 'selected' : ''}>Male</option>
      <option value="Female" ${u.gender === 'Female' ? 'selected' : ''}>Female</option>
     </select>
    </div>
    <div>
     <label for="pMeal" class="${CLS.label}">Meal restrictions / dietary preferences</label>
     <input id="pMeal" value="${esc(u.meal_restrictions || '')}" placeholder="e.g. Vegetarian, Gluten-free, Halal, Allergies…" class="${CLS.input}">
    </div>
   </div>

   ${section('Roommate preferences', 'fa-users', `<div class="space-y-2">${[1, 2, 3, 4, 5].map(roommateSelect).join('')}</div>`,
     'Choose other officials in order of preference (1 = top choice, 5 = lowest). Names come from the referee directory, so they always match.')}

   ${section('Weapon ratings', 'fa-medal', `<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${rate('Foil', u.foil)}${rate('Épée', u.epee)}${rate('Sabre', u.sabre)}${rate('Para', u.para)}</div>`)}

   ${section('Change password', 'fa-key', `${recovering ? msgBox('info', 'Enter a new password below, then select <strong>Save changes</strong>.', 'mb-3') : ''}
    <label for="pNew" class="${CLS.label}">New password</label>
    <input type="password" id="pNew" autocomplete="new-password" aria-describedby="pNewHint" class="${CLS.input} sm:max-w-sm">
    <p id="pNewHint" class="mt-1 text-xs text-slate-600">Leave blank to keep your current password. At least 10 characters.</p>`)}

   <div id="profileMsg" class="hidden" aria-live="polite"></div>
   <div class="flex sm:justify-end border-t border-slate-200 pt-5"><button id="profileSave" class="${CLS.primary} w-full sm:w-auto px-6">Save changes</button></div></form>`)}</div>`;
  syncRoommates();
  if (recovering) $('pNew').focus();
}
/* Grey out names already picked in another roommate slot. */
function syncRoommates() {
  const sels = [1, 2, 3, 4, 5].map(n => $(`pRoommate${n}`)).filter(Boolean);
  sels.forEach(s => [...s.options].forEach(o => { o.disabled = !!o.value && sels.some(x => x !== s && sameName(x.value, o.value)); }));
}

async function saveProfile(e) {
  e.preventDefault();
  say('profileMsg');
  const pw = $('pNew').value;
  const gender = $('pGender').value;
  if (!gender) return fieldErr('pGender', 'profileMsg', 'Gender selection is required.');
  if (pw && pw.length < 10) return fieldErr('pNew', 'profileMsg', 'Use a password with at least 10 characters.');

  const roommate_prefs = [1, 2, 3, 4, 5].map(num => $(`pRoommate${num}`).value.trim()).filter(Boolean);
  const row = {
    name: $('pName').value.trim(),
    phone: $('pPhone').value.trim(),
    region: $('pRegion').value.trim(),
    gender: gender,
    meal_restrictions: $('pMeal').value.trim(),
    roommate_prefs: roommate_prefs
  };

  await busy($('profileSave'), async () => {
    if (fail(await sb.from('profiles').update(row).eq('id', S.uid), 'profileMsg')) return;
    Object.assign(S.me, row);
    if (pw && fail(await sb.auth.updateUser({ password: pw }), 'profileMsg')) return;
    $('pNew').value = '';
    if (recovering && pw) { recovering = false; rProfile(); }
    $('hName').textContent = S.me.name;
    $('greet').innerHTML = `Signed in as <span class="font-semibold text-slate-900">${esc(S.me.name)}</span> (${esc(S.me.role)})`;
    toast('Profile saved.');
  });
}

/* ===== Referee Directory Search Tab ===== */
function rDirectory() {
  $('v-directory').innerHTML = `${viewHead('Referee directory', 'Search and view active referees, their regions, genders, and weapon ratings.')}
  ${tablePanel(`
   <div class="mb-4 sm:max-w-sm">
    <label for="dirSearchInput" class="${CLS.label}">Search by name or region</label>
    <div class="relative">
     <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></span>
     <input type="search" id="dirSearchInput" value="${esc(dirQuery)}" oninput="updateDirQuery(this.value)" autocomplete="off" class="${CLS.input} pl-9">
    </div>
   </div>
   <div id="dirResults"></div>
   <p id="dirCount" class="text-sm text-slate-600 mt-4" aria-live="polite"></p>`)}`;
  drawDirectory();
}
function drawDirectory() {
  const query = (dirQuery || '').trim().toLowerCase();

  const filteredUsers = S.users.filter(u => {
    if (!u.active) return false;
    if (!query) return true;
    const fullName = (u.name || '').toLowerCase();
    const region = (u.region || '').toLowerCase();
    return fullName.includes(query) || region.includes(query);
  });

  const td = `${TB.td} ${TB.lbl}`;
  const rate = (l, v) => `<td data-label="${l}" class="${td} max-md:rounded-lg max-md:bg-slate-50 max-md:px-2 max-md:py-1.5 font-mono font-semibold text-slate-900">${esc(v)}</td>`;
  const rows = filteredUsers.map(r => `
    <tr class="${TB.tr} max-md:grid-cols-4">
     <td class="${TB.td} max-md:col-span-4 font-semibold text-slate-900 max-md:text-base">${esc(r.name)}</td>
     <td data-label="Gender" class="${td} max-md:col-span-2 text-slate-700">${esc(r.gender || '—')}</td>
     <td data-label="Region" class="${td} max-md:col-span-2 text-slate-700">${esc(r.region || '—')}</td>
     ${rate('Foil', r.foil)}${rate('Épée', r.epee)}${rate('Sabre', r.sabre)}${rate('Para', r.para)}
    </tr>`).join('');

  $('dirResults').innerHTML = filteredUsers.length ? `<div class="md:overflow-x-auto"><table class="${TB.table}">
     <thead class="${TB.thead}"><tr>${['Name', 'Gender', 'Region', 'Foil', 'Épée', 'Sabre', 'Para'].map(h => `<th scope="col" class="${TB.th}">${h}</th>`).join('')}</tr></thead>
     <tbody class="${TB.tbody}">${rows}</tbody></table></div>`
    : panel('<p class="text-sm text-slate-600">No referees found matching your search.</p>');
  $('dirCount').textContent = `Showing ${filteredUsers.length} referee(s)`;
}

function updateDirQuery(val) {
  dirQuery = val;
  drawDirectory(); // only the results are redrawn, so the search box keeps focus and cursor position
}

/* ===== Assignor desk ===== */
const DOT = { yes: ['fa-solid fa-circle-check text-emerald-700', 'Full day'], am: [null, 'Morning only'], pm: [null, 'Afternoon only'], no: ['fa-solid fa-circle-xmark text-red-700', 'Unavailable'], none: ['fa-regular fa-circle text-slate-500', 'No answer'] };

function rAssignor() {
  if (!S.events.find(e => e.id === aEv)) aEv = S.events[0]?.id;
  const ev = S.events.find(e => e.id === aEv);
  if (!ev) { $('v-assignor').innerHTML = viewHead('Assignor review & roster', '') + panel('<p class="text-sm text-slate-600">No tournaments to staff yet.</p>'); return; }
  const dot = (v, d, i) => {
    const [cls, txt] = DOT[v || 'none'];
    const mark = cls ? `<i class="${cls}" aria-hidden="true"></i>` : `<span class="text-[11px] font-bold text-sky-800" aria-hidden="true">${v.toUpperCase()}</span>`;

  };

  let activeUsers = S.users.filter(r => r.active);

  // Sorting Logic

      const sA = status(ev, a.id), sB = status(ev, b.id);
      if (statusOrder[sA] !== statusOrder[sB]) return statusOrder[sA] - statusOrder[sB];
    } else if (aSort === 'assigned') {
      const onA = S.asg.some(x => x.event_id === ev.id && x.user_id === a.id) ? 1 : 0;
      const onB = S.asg.some(x => x.event_id === ev.id && x.user_id === b.id) ? 1 : 0;
      if (onA !== onB) return onB - onA; // Assigned first
    } else if (aSort === 'unassigned') {
      const onA = S.asg.some(x => x.event_id === ev.id && x.user_id === a.id) ? 1 : 0;
      const onB = S.asg.some(x => x.event_id === ev.id && x.user_id === b.id) ? 1 : 0;
      if (onA !== onB) return onA - onB; // Unassigned first
    }
    return a.name.localeCompare(b.name);

     <td data-label="Days" class="${td} max-md:order-5 max-md:col-span-2"><ul class="flex flex-wrap md:flex-nowrap gap-1">${ev.days.map((d, i) => dot(avOf(r.id, ev.id, d), d, i)).join('')}</ul></td>

     <td data-label="Meal restrictions" class="${td} max-md:order-7 max-md:col-span-2 md:max-w-[12rem]">${mealDisplay}</td>

async function toggleAssign(evId, userId, on) {
  const targetUser = S.users.find(u => u.id === userId);
  if (targetUser && isRcOrUnratedOnly(targetUser) && S.me?.role !== 'admin') {
    return toast('Referees with only Unrated or Rc ratings can only be assigned by an Admin.', 'error');
  }
  const r = on ? await sb.from('assignments').delete().match({ event_id: evId, user_id: userId }) : await sb.from('assignments').insert({ event_id: evId, user_id: userId });
  if (fail(r)) return;
  if (on) S.asg = S.asg.filter(a => !(a.event_id === evId && a.user_id === userId));
  else S.asg.push({ event_id: evId, user_id: userId });
  withFocus(rAssignor);
}

/* ===== Rooming List Generator Modal ===== */
function openRoomingModal() {
  say('asgMsg');
  const ev = S.events.find(e => e.id === aEv);
  if (!ev) return say('asgMsg', 'info', 'Select a tournament first.');

  const accomDays = getAccomDays(ev);

  const assignedUsers = S.users.filter(u => {
    const isAssigned = S.asg.some(a => a.event_id === ev.id && a.user_id === u.id);
    const needsAccom = accomDays.some(d => accomOf(u.id, ev.id, d));
    return isAssigned && needsAccom;
  });

  if (assignedUsers.length === 0) {
    return say('asgMsg', 'info', 'No assigned referees require accommodation for this tournament.');
  }

  const userNights = (userId) => accomDays.filter(d => accomOf(userId, ev.id, d));

  const getMutualScore = (userA, userB) => {
    const prefsA = Array.isArray(userA.roommate_prefs) ? userA.roommate_prefs : [];
    const prefsB = Array.isArray(userB.roommate_prefs) ? userB.roommate_prefs : [];

    const indexA = prefsA.findIndex(name => name.trim().toLowerCase() === userB.name.trim().toLowerCase());
    const indexB = prefsB.findIndex(name => name.trim().toLowerCase() === userA.name.trim().toLowerCase());

    const sameGender = userA.gender === userB.gender;

    if (!sameGender) {
      if (indexA === -1 || indexB === -1) return 0;
    }

    let score = 0;
    if (indexA !== -1) score += (6 - (indexA + 1));
    if (indexB !== -1) score += (6 - (indexB + 1));
    if (sameGender) score += 2;

    return score;
  };

  let unassigned = [...assignedUsers];
  let rooms = [];

  unassigned.sort((a, b) => userNights(b.id).length - userNights(a.id).length);

  while (unassigned.length > 0) {
    const primary = unassigned.shift();
    const primaryNights = userNights(primary.id);
    let bestMatchIdx = -1;
    let bestScore = -999;

    for (let i = 0; i < unassigned.length; i++) {
      const candidate = unassigned[i];
      const candidateNights = userNights(candidate.id);

      const exactNightMatch = primaryNights.length === candidateNights.length &&
        primaryNights.every(n => candidateNights.includes(n));

      let score = exactNightMatch ? 10 : 0;

      const prefScore = getMutualScore(primary, candidate);
      if (primary.gender !== candidate.gender && prefScore === 0) {
        continue;
      }
      score += prefScore * 3;

      if (score > bestScore) {
        bestScore = score;
        bestMatchIdx = i;
      }
    }

    if (bestMatchIdx !== -1) {
      const match = unassigned.splice(bestMatchIdx, 1)[0];
      rooms.push({ type: 'Double', occupants: [primary, match] });
    } else {
      rooms.push({ type: 'Single', occupants: [primary] });
    }
  }

  const roomsHtml = rooms.map((room, idx) => {
    const occ = room.occupants.map(o => `<li><span class="font-semibold text-slate-900">${esc(o.name)}</span> <span class="text-xs text-slate-600">(${esc(o.gender || '—')}, Reg: ${esc(o.region)})</span></li>`).join('');
    const sharedNights = accomDays.filter(d => room.occupants.every(o => accomOf(o.id, ev.id, d)));

    return `<li class="rounded-xl bg-slate-50 ring-1 ring-slate-200 p-3.5 text-sm">
      <div class="flex items-start justify-between gap-3">
       <h4 class="font-bold text-slate-900">Room #${idx + 1} <span class="font-medium text-slate-600">(${room.type})</span></h4>
       <span class="shrink-0 rounded bg-white px-2 py-0.5 text-[11px] font-bold uppercase text-slate-700 ring-1 ring-slate-300">${room.occupants.length} Guest(s)</span>
      </div>
      <ul class="mt-1 space-y-0.5">${occ}</ul>
      <p class="mt-1.5 text-xs text-blue-800"><i class="fa-solid fa-calendar-days mr-1" aria-hidden="true"></i>Nights: ${esc(sharedNights.join(', ') || 'Partial/Mixed nights')}</p>
    </li>`;
  }).join('');

  openModal(`
   <div class="flex justify-between items-start gap-3 mb-3">
    <h3 id="modalTitle" class="text-lg font-bold text-slate-900">Optimized rooming list</h3>
    <button type="button" onclick="closeModal()" aria-label="Close" class="no-print ${CLS.icon} -mt-1 -mr-2"><i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i></button>
   </div>
   <p class="text-sm text-slate-600 mb-4">Generated for <strong class="text-slate-900">${esc(ev.name)}</strong> based on assigned staff, night overlap harmony, and mutual roommate preferences (max 2 per room).</p>
   <ol class="print-scroll space-y-3 max-h-[60vh] overflow-y-auto pr-1">${roomsHtml}</ol>
   <div class="no-print flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-4 border-t border-slate-200 mt-4">
    <button type="button" onclick="closeModal()" class="${CLS.secondary}">Close</button>
    <button type="button" onclick="window.print()" class="${CLS.primary}"><i class="fa-solid fa-print" aria-hidden="true"></i>Print list</button>
   </div>
  `);
}

/* ===== Modals ===== */
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
let modalReturn = null, confirmResolve = null;
function openModal(html, size = 'max-w-lg') {
  const m = $('modal');
  if (m.classList.contains('hidden')) modalReturn = { el: document.activeElement, key: document.activeElement?.dataset?.key };
  m.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="bg-white rounded-2xl shadow-xl w-full ${size} p-5 sm:p-6 my-4 sm:my-8">${html}</div>`;
  m.classList.remove('hidden'); m.classList.add('flex');
  document.querySelectorAll('body > header, body > main, body > footer, body > a').forEach(x => x.inert = true);
  document.body.classList.add('overflow-hidden');
  (m.querySelector('[autofocus]') || m.querySelector(FOCUSABLE))?.focus();
}
function closeModal() {
  const m = $('modal'); if (m.classList.contains('hidden')) return;
  m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = '';
  document.querySelectorAll('body > header, body > main, body > footer, body > a').forEach(x => x.inert = false);
  document.body.classList.remove('overflow-hidden');
  const r = modalReturn; modalReturn = null;
  const back = r?.el && document.contains(r.el) ? r.el : r?.key ? document.querySelector(`[data-key="${CSS.escape(r.key)}"]`) : null;
  back?.focus();
  if (confirmResolve) { const res = confirmResolve; confirmResolve = null; res(false); }
}
/* Esc closes; Tab and Shift+Tab cycle inside the open dialog. */
document.addEventListener('keydown', e => {
  const m = $('modal'); if (m.classList.contains('hidden')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key !== 'Tab') return;
  const f = [...m.querySelectorAll(FOCUSABLE)].filter(x => x.getClientRects().length);
  if (!f.length) return e.preventDefault();
  const first = f[0], last = f[f.length - 1], cur = document.activeElement;
  if (e.shiftKey && (cur === first || !m.contains(cur))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (cur === last || !m.contains(cur))) { e.preventDefault(); first.focus(); }
});
/* Promise-based replacement for confirm(). */
function askConfirm({ title, body, ok = 'Confirm', danger = false }) {
  return new Promise(res => {
    openModal(`<h3 id="modalTitle" class="text-lg font-bold text-slate-900">${esc(title)}</h3>
      <p class="mt-2 text-sm text-slate-700">${esc(body)}</p>
      <div class="mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
       <button type="button" onclick="closeModal()" autofocus class="${CLS.secondary}">Cancel</button>
       <button type="button" id="confirmOk" class="${danger ? CLS.danger : CLS.primary}">${esc(ok)}</button></div>`, 'max-w-md');
    confirmResolve = res;
    $('confirmOk').onclick = () => { confirmResolve = null; closeModal(); res(true); };
  });
}

const opts = (arr, v) => arr.map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join('');
const btns = `<div id="modalMsg" class="hidden" aria-live="polite"></div>

const modalHead = title => `<div class="flex justify-between items-start gap-3 mb-4"><h3 id="modalTitle" class="text-lg font-bold text-slate-900">${title}</h3>

   <div class="grid sm:grid-cols-2 gap-4">${fld('name', 'Full name', u.name)}${fld('email', 'Email address', u.email, 'readonly')}${fld('phone', 'Phone', u.phone)}${fld('region', 'Home region', u.region)}
   <div><label for="f-gender" class="${CLS.label}">Gender</label><select id="f-gender" name="gender" class="${CLS.input}"><option value="">Select gender…</option><option value="Male" ${u.gender === 'Male' ? 'selected' : ''}>Male</option><option value="Female" ${u.gender === 'Female' ? 'selected' : ''}>Female</option></select></div>
   <div><label for="f-meal" class="${CLS.label}">Meal restrictions</label><input id="f-meal" name="meal_restrictions" value="${esc(u.meal_restrictions || '')}" class="${CLS.input}"></div>
   <div><label for="f-role" class="${CLS.label}">Role</label><select id="f-role" name="role" class="${CLS.input}">${opts(['referee', 'assignor', 'admin'], u.role)}</select></div>
   <div><label for="f-active" class="${CLS.label}">Status</label><select id="f-active" name="active" class="${CLS.input}"><option value="1" ${u.active ? 'selected' : ''}>Active</option><option value="0" ${u.active ? '' : 'selected'}>Inactive</option></select></div></div>
   <fieldset class="border-t border-slate-200 pt-4"><legend class="sr-only">Weapon ratings</legend><p class="text-sm font-bold text-slate-900 mb-3" aria-hidden="true">Weapon ratings</p>
   <div class="grid grid-cols-2 gap-3">${sel('foil', 'Foil', WR)}${sel('epee', 'Épée', WR)}${sel('sabre', 'Sabre', WR)}${sel('para', 'Para', PR)}</div></fieldset>${btns}</form>`);
}
async function saveUser(e, id) {
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), u = S.users.find(x => x.id === id);
  const admins = S.users.filter(x => x.role === 'admin' && x.active).length;
  if (u.role === 'admin' && u.active && (f.role !== 'admin' || f.active === '0') && admins < 2) return say('modalMsg', 'error', 'Keep at least one active admin.');
  const row = { name: f.name.trim(), phone: f.phone.trim(), region: f.region.trim(), gender: f.gender, meal_restrictions: f.meal_restrictions.trim(), role: f.role, active: f.active === '1', foil: f.foil, epee: f.epee, sabre: f.sabre, para: f.para };
  const r = await busy($('modalSave'), () => sb.from('profiles').update(row).eq('id', id));
  if (fail(r, 'modalMsg')) return;
  Object.assign(u, row); closeModal(); toast(`Saved ${u.name}.`);
  if (id === S.uid) render(); else withFocus(rAdmin);
}
function evModal(id) {
  const ev = id ? S.events.find(x => x.id === id) : { days: [] };
  openModal(`${modalHead(`${id ? 'Edit' : 'Add'} tournament`)}<form data-id="${esc(id || '')}" onsubmit="saveEv(event, this.dataset.id)" class="space-y-4">
   ${fld('name', 'Tournament name', ev.name)}${fld('date_range', 'Dates (display text)', ev.date_range, 'placeholder="e.g. Nov 28-29, 2026"')}${fld('location', 'Location', ev.location)}
   <div><label for="f-days" class="${CLS.label}">Days, one per line</label><textarea id="f-days" name="days" rows="4" required aria-describedby="f-days-hint" class="${CLS.input}">${esc(ev.days.join('\n'))}</textarea>
   <p id="f-days-hint" class="mt-1 text-xs text-slate-600">Each line becomes one day referees can mark. Renaming a day hides answers already given for it.</p></div>${btns}</form>`);
}
async function saveEv(e, id) {
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
  const days = [...new Set(f.days.split('\n').map(x => x.trim()).filter(Boolean))];
  if (!days.length) return fieldErr('f-days', 'modalMsg', 'Add at least one day.');
  const row = { name: f.name.trim(), date_range: f.date_range.trim(), location: f.location.trim(), days };
  const r = await busy($('modalSave'), () => id ? sb.from('events').update(row).eq('id', id) : sb.from('events').insert(row));
  if (fail(r, 'modalMsg')) return;
  closeModal();
  if (id) { Object.assign(S.events.find(x => x.id === id), row); withFocus(rAdmin); toast('Tournament saved.'); }
  else { await refresh(); toast('Tournament added.'); } // reload so the new row has its database id
}
</script>
</body>
</html>
